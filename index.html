<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/styles/style.css">
    <link rel="icon" href="./assets/images/small logo with circle.png">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Dashboard</title>
</head>
<body>
    <div class="dashboard">
        <div class="menu-bar">
                <ul>
                    <li>
                        <a href="#" id="toggle">
                            <i class='bx bx-menu'></i>
                            <span>Menu</span>
                            
                        </a>
                        <hr>
                    </li>
                    <li>
                        <a href="#" class="active">
                            <i class='bx bx-grid'></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class='bx bx-message'></i>
                            <span>Messages</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class='bx bx-envelope'></i>
                            <span>Mail</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class='bx bx-bell'></i>
                            <span>Alerts</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class='bx bx-calendar'></i>
                            <span>Calender</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class='bx bx-cog'></i>
                            <span>Settings</span>
                        </a>
                    </li>
                    <li>
                        <hr>
                        <a href="#">
                            <i class='bx bx-arrow-from-left'></i>
                            <span>Log Out</span>
                        </a>
                    </li>
                </ul>
        </div>
        <div class="main-dashboard">
            <nav>
                <img src="./assets/images/small logo with circle.png" alt="small-logo">
                <h1>Dashboard</h1>
                <span class="right">
                    <a href="#" id="user">
                    <i class="bx bx-user-circle"></i>
                    </a>
                </span>
            </nav>
            <div class="dashboard-grid">
                <div class="profile display">
                    <img src="assets/images/profile.png" alt="profile">
                    <h3>Name</h3>
                    <h4>Status</h4>
                    <hr>
                    <div class="info">
                        <h5>Information</h5>
                    </div> 
                </div>
               
                <div class="container-1">
                </div>
                <div class="container-2">
                </div>
            </div>
            
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
